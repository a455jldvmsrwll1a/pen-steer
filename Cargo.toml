[package]
name = "pen-steer"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
arc-swap = "1.9.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
env_logger = "0.11.11"
flume = "0.12.0"
glam = "0.34.0"
log = "0.4.34"
rtrb = "0.4.0"
slint = "1.18.1"
triple_buffer = "9.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
nix = "0.31.3"
input-linux = "0.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
vigem-client = "0.1.4"

[build-dependencies]
slint-build = "1.18.1"
